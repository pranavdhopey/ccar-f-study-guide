<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>1.1 Agentic Loops: practice questions</title>
<style>
:root {
  --bg: #fdfbf2; --card: #ffffff; --ink: #1f2a44; --muted: #5b6577; --line: #d9dde6;
  --accent: #1f3a8a; --ok: #1d7a46; --ok-bg: #e4f5ea; --bad: #b3261e; --bad-bg: #fbe9e7;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #14171f; --card: #1c212c; --ink: #e8ebf2; --muted: #9aa4b8; --line: #323a4b;
    --accent: #8fa8ff; --ok: #6fd39a; --ok-bg: #173325; --bad: #ff9b92; --bad-bg: #3a1c19;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink);
  font: 17px/1.55 system-ui, -apple-system, "Segoe UI", sans-serif; }
main { max-width: 720px; margin: 0 auto; padding: 24px 16px 64px; }
h1 { font-size: 1.6rem; line-height: 1.25; margin: 0 0 4px; }
.intro { color: var(--muted); margin: 0 0 16px; }
.bar { position: sticky; top: 0; z-index: 2; display: flex; gap: 12px; align-items: center;
  justify-content: space-between; padding: 10px 14px; margin: 0 -2px 16px; background: var(--card);
  border: 1px solid var(--line); border-radius: 12px; }
.bar button { font: inherit; font-size: .9rem; padding: 4px 12px; border-radius: 8px; cursor: pointer;
  border: 1px solid var(--line); background: transparent; color: var(--ink); }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 18px 18px 14px; margin: 0 0 16px; }
.q-head { display: flex; gap: 8px; align-items: center; margin-bottom: 6px; font-size: .85rem; color: var(--muted); }
.pill { border: 1px solid var(--line); border-radius: 999px; padding: 0 10px; }
.pill.bonus { color: var(--accent); border-color: var(--accent); }
.prompt { margin: 0 0 12px; font-weight: 600; }
.opts { display: grid; gap: 8px; padding: 0; margin: 0; list-style: none; }
.opt { width: 100%; text-align: left; font: inherit; color: var(--ink); background: transparent;
  border: 1.5px solid var(--line); border-radius: 10px; padding: 10px 12px; cursor: pointer;
  display: flex; gap: 10px; }
.opt:hover:not(:disabled) { border-color: var(--accent); }
.opt:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.opt .k { font-weight: 700; color: var(--muted); min-width: 1.2em; }
.opt:disabled { cursor: default; }
.opt.correct { border-color: var(--ok); background: var(--ok-bg); }
.opt.wrong { border-color: var(--bad); background: var(--bad-bg); }
.fb { margin: 12px 0 2px; padding: 10px 12px; border-radius: 10px; background: var(--bg); border-left: 4px solid var(--accent); }
.fb strong.ok { color: var(--ok); } .fb strong.no { color: var(--bad); }
.result { text-align: center; padding: 20px; border: 2px dashed var(--accent); border-radius: 14px; }
.result .big { font-size: 2rem; font-weight: 700; }
[hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <h1 id="title"></h1>
  <p class="intro" id="intro"></p>
  <div class="bar" aria-live="polite">
    <span id="score"></span>
    <button id="reset" type="button">Start over</button>
  </div>
  <div id="list"></div>
  <div class="result" id="result" hidden>
    <div class="big" id="final"></div>
    <p id="verdict"></p>
  </div>
</main>
<script>
const DATA = {"title": "1.1 Agentic Loops: practice questions", "intro": "Exam-style questions for CCAR-F Task 1.1. Pick an answer to see why it is right or wrong.", "questions": [{"tag": "core", "prompt": "In an agentic loop, Claude decides it needs your lookup_order tool. Who actually runs that function?", "options": ["Claude, on Anthropic's servers, before it replies", "Claude, but only when tool_choice is set to \"any\"", "The Messages API, automatically, using the tool definition", "Your code, after Claude's response asks for the call"], "answer": 3, "explanation": "Claude never runs a tool you define. Its response asks for the call (stop_reason \"tool_use\"), your code runs the function and sends the result back."}, {"tag": "core", "prompt": "Which description best matches the agentic loop?", "options": ["A prompting technique that tells Claude to think step by step", "A retry mechanism that resends a request when the API fails", "Deterministic control flow in your code that sends requests, runs the tools Claude asks for, and repeats until Claude is finished", "A single chat turn in which Claude answers one question"], "answer": 2, "explanation": "The loop is ordinary code you write. It is not a prompt trick, a retry loop or a chatbot turn."}, {"tag": "core", "prompt": "Your loop gets a response with stop_reason \"tool_use\". What should it do next?", "options": ["Run the requested tool(s), append the results to the conversation history, and send the updated conversation back to Claude", "Wait until stop_reason is \"end_turn\" before running anything", "Return the text to the user, because Claude has answered", "Start a new conversation containing only the tool result"], "answer": 0, "explanation": "Step 3 of the lifecycle: execute the tools, append the results as a new message, send the whole conversation again. Starting fresh would lose the context Claude needs."}, {"tag": "core", "prompt": "A bakery's support agent answers \"Where is my cake order?\" Claude's response contains a text block (\"Let me check your order\") followed by a tool_use block for track_order. The developer's code checks response.content[0].type == \"text\" and returns, so the customer gets only \"Let me check your order\". What is the root cause?", "options": ["Claude should be prompted never to write text before a tool call", "The code treats the presence of text as completion, but Claude can return text alongside tool_use blocks. It should check stop_reason instead", "The track_order tool definition is missing a description", "max_tokens is too low, so the response was cut off"], "answer": 1, "explanation": "This is anti-pattern 3. Text presence says nothing about whether the agent is finished. Fix: continue on \"tool_use\", stop on \"end_turn\", whatever content types the response holds."}, {"tag": "core", "prompt": "A developer ends the loop when Claude's text contains \"task complete\" or \"I'm done\". Why is this unreliable?", "options": ["Natural language is ambiguous. Claude might say it finished one step while intending to continue, so the phrase does not reliably mean the whole task is done", "Claude never writes phrases like that", "Checking text is much slower than checking stop_reason", "The check is case-sensitive, so it misses some replies"], "answer": 0, "explanation": "Anti-pattern 1. stop_reason exists to remove exactly this ambiguity: it is deterministic and unambiguous."}, {"tag": "core", "prompt": "An agent's loop stops after 10 iterations. Tasks that need 12 iterations are cut off, while simple tasks finish in 3 and still run extra loops. What is the best fix?", "options": ["Raise the cap to 15 and keep it as the main stopping rule", "Remove the stop_reason check and rely on the cap alone", "Ask Claude to reply \"DONE\" so the code can stop on that word", "Make stop_reason the primary control, and keep a cap only as a safety net against runaway agents"], "answer": 3, "explanation": "Anti-pattern 2. A fixed cap either cuts off useful work or wastes iterations. Claude signals completion through stop_reason. A generous cap (e.g. 20) is fine as a backup, never as the primary mechanism."}, {"tag": "core", "prompt": "To save tokens, a developer sends each next request WITHOUT the tool results from the previous step. What happens?", "options": ["Claude remembers the results from the earlier call on the server", "The API fills in the missing results from its cache", "The loop finishes faster and the final answer is the same", "Claude never sees what the tool returned, because the Messages API keeps no server-side memory of the turn, so it has nothing new to reason about"], "answer": 3, "explanation": "Every request must carry the full history, including tool results. Dropping them leaves the model blind to what the tool returned."}, {"tag": "core", "prompt": "A tool returns a very large JSON blob and token costs are climbing. What is the right way to reduce them?", "options": ["Shrink what the tool returns, for example by returning only the fields Claude needs", "Replace the whole history with a short summary on every round", "Drop the tool result and let Claude guess", "Lower the iteration cap to 2"], "answer": 0, "explanation": "Keep appending each tool result to the history, but make the results smaller at the source. Summarising away or dropping the history breaks the loop."}, {"tag": "core", "prompt": "A customer asks for their fitting date. The agent must call lookup_order, then check_diary, and then reply. With a correct loop, what is the minimum number of Messages API requests sent to Claude?", "options": ["1", "2", "3", "4"], "answer": 2, "explanation": "Request 1 returns tool_use (lookup_order). Request 2, with that result, returns tool_use (check_diary). Request 3, with both results, returns end_turn with the reply."}, {"tag": "core", "prompt": "A store's refund policy says any refund over $500 must have manager approval, with no exceptions. Where should that rule be enforced?", "options": ["In the system prompt, asking Claude to always remember it", "In the tool description only", "In code that enforces it programmatically, whatever Claude decides (covered in Task 1.4)", "Nowhere special: model-driven tool selection will handle it"], "answer": 2, "explanation": "Model-driven selection is the default because it flexes. The exception is business logic that demands deterministic compliance (money, security, regulations), which programmatic enforcement overrides."}, {"tag": "bonus", "prompt": "Beyond the two exam values: a production loop receives stop_reason \"refusal\". What is the right way to think about it?", "options": ["Treat it as \"tool_use\" and run the tools", "It is a normal HTTP 200 response in which Claude declined to respond, so it is not finished normally and should be handled explicitly rather than assumed to be tool_use or end_turn", "It is an API error, so retry the same request until it succeeds", "Treat it exactly like \"end_turn\" and show the output"], "answer": 1, "explanation": "Current API docs list pause_turn, max_tokens, stop_sequence, refusal and model_context_window_exceeded as well. Treat any value other than end_turn as \"not finished, check why\". This is beyond what the exam guide v1.0 keys, so it is a bonus question."}, {"tag": "core", "prompt": "One reply from Claude contains two tool_use blocks (parallel tool calls). How should your loop send the results back?", "options": ["As two separate user messages, one per tool call", "As one user message holding one tool_result per tool_use block, matched by tool_use_id", "Only the first result. Claude will ask again for the other one", "Inside the assistant message, before sending the next request"], "answer": 1, "explanation": "Every tool_use needs a matching tool_result with the same id, and all of them go back together in a single user message. Example 5 does exactly this."}, {"tag": "core", "prompt": "In production, your safety cap of 20 iterations fires on a request. What does that most likely tell you?", "options": ["Something is probably wrong (a stuck or runaway agent), so log a warning and investigate. The cap is a backup, not a normal exit", "Nothing unusual: tasks normally finish when they reach the cap", "The cap is too low, so raise it to 100", "Claude has finished, so treat it like end_turn"], "answer": 0, "explanation": "Normal runs end through stop_reason == \"end_turn\", usually in a few rounds. A cap that fires means the loop is not converging. Example 4's --runaway mode shows this."}, {"tag": "core", "prompt": "Your get_monthly_cost tool raises a KeyError for an unknown machine type. What should the loop do?", "options": ["Let the exception crash the loop", "Catch it and send a tool_result with the error text and is_error set to true, so Claude can adapt", "Skip the tool_result for that call and carry on", "Restart the conversation from the first message"], "answer": 1, "explanation": "Each tool_use must get a tool_result, even a failed one. Reporting the error lets Claude explain the gap or try something else. Skipping the result would leave a tool_use unanswered, which the API rejects."}, {"tag": "core", "prompt": "A correct loop has already made two tool rounds, starting from one user question. How many messages are in the request for the third round?", "options": ["3", "4", "5", "6"], "answer": 2, "explanation": "1 question + 2 messages per tool round (Claude's request and your tool_result) x 2 rounds = 5. Example 2 prints this growth: 1, then 3, then 5."}, {"tag": "core", "prompt": "A loop keeps receiving stop_reason \"tool_use\" asking for the same lookup_order call, round after round, and never progresses. Which bug is the most likely cause?", "options": ["The tool description is too long", "max_tokens is set too high", "Claude is unable to use that tool", "The assistant message and tool_result are not being appended, so every request looks like round 1"], "answer": 3, "explanation": "The API keeps no memory, so without the appended history Claude sees the same question each time and asks for the same tool. Example 3's \"noappend\" demo shows this, and why a safety cap is still worth having."}]};
const LETTERS = "ABCDEFGH";
const $ = (id) => document.getElementById(id);
let answered = 0, correct = 0;

function el(tag, cls, text) {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text !== undefined) n.textContent = text;
  return n;
}

function updateScore() {
  const total = DATA.questions.length;
  $("score").textContent = `Answered ${answered} of ${total}  ·  Correct ${correct}`;
  if (answered === total) {
    const pct = Math.round((correct / total) * 100);
    $("final").textContent = `${correct} / ${total}  (${pct}%)`;
    $("verdict").textContent = pct >= 80
      ? "Strong. Move on to the next topic, or re-read the notes for anything you missed."
      : "Re-read the notes and the explanations for the ones you missed, then try again.";
    $("result").hidden = false;
  } else {
    $("result").hidden = true;
  }
}

function build() {
  answered = 0; correct = 0;
  $("title").textContent = DATA.title;
  $("intro").textContent = DATA.intro;
  const list = $("list");
  list.replaceChildren();

  DATA.questions.forEach((q, qi) => {
    const card = el("section", "card");
    const head = el("div", "q-head");
    head.append(el("span", "", `Question ${qi + 1}`),
      el("span", "pill" + (q.tag === "bonus" ? " bonus" : ""), q.tag === "bonus" ? "Beyond the exam key" : "Exam topic"));
    card.append(head, el("p", "prompt", q.prompt));

    const ul = el("ul", "opts");
    const buttons = [];
    const fb = el("div", "fb");
    fb.hidden = true;
    fb.setAttribute("role", "status");

    q.options.forEach((text, oi) => {
      const li = el("li");
      const b = el("button", "opt");
      b.type = "button";
      b.append(el("span", "k", LETTERS[oi]), el("span", "", text));
      b.addEventListener("click", () => {
        buttons.forEach((x) => (x.disabled = true));
        const right = oi === q.answer;
        buttons[q.answer].classList.add("correct");
        if (!right) b.classList.add("wrong");
        const label = el("strong", right ? "ok" : "no", right ? "Correct. " : `Not quite. The answer is ${LETTERS[q.answer]}. `);
        fb.replaceChildren(label, document.createTextNode(q.explanation));
        fb.hidden = false;
        answered += 1; if (right) correct += 1;
        updateScore();
      });
      buttons.push(b);
      li.append(b);
      ul.append(li);
    });
    card.append(ul, fb);
    list.append(card);
  });
  updateScore();
}

$("reset").addEventListener("click", () => { build(); window.scrollTo({ top: 0 }); });
build();
</script>
</body>
</html>
