<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>1.2 Multi-Agent Orchestration: practice questions</title>
<style>
:root {
  --bg: #fdfbf2; --card: #ffffff; --ink: #1f2a44; --muted: #5b6577; --line: #d9dde6;
  --accent: #1f3a8a; --ok: #1d7a46; --ok-bg: #e4f5ea; --bad: #b3261e; --bad-bg: #fbe9e7;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #14171f; --card: #1c212c; --ink: #e8ebf2; --muted: #9aa4b8; --line: #323a4b;
    --accent: #8fa8ff; --ok: #6fd39a; --ok-bg: #173325; --bad: #ff9b92; --bad-bg: #3a1c19;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink);
  font: 17px/1.55 system-ui, -apple-system, "Segoe UI", sans-serif; }
main { max-width: 720px; margin: 0 auto; padding: 24px 16px 64px; }
h1 { font-size: 1.6rem; line-height: 1.25; margin: 0 0 4px; }
.intro { color: var(--muted); margin: 0 0 16px; }
.bar { position: sticky; top: 0; z-index: 2; display: flex; gap: 12px; align-items: center;
  justify-content: space-between; padding: 10px 14px; margin: 0 -2px 16px; background: var(--card);
  border: 1px solid var(--line); border-radius: 12px; }
.bar button { font: inherit; font-size: .9rem; padding: 4px 12px; border-radius: 8px; cursor: pointer;
  border: 1px solid var(--line); background: transparent; color: var(--ink); }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 18px 18px 14px; margin: 0 0 16px; }
.q-head { display: flex; gap: 8px; align-items: center; margin-bottom: 6px; font-size: .85rem; color: var(--muted); }
.pill { border: 1px solid var(--line); border-radius: 999px; padding: 0 10px; }
.pill.bonus { color: var(--accent); border-color: var(--accent); }
.prompt { margin: 0 0 12px; font-weight: 600; }
.opts { display: grid; gap: 8px; padding: 0; margin: 0; list-style: none; }
.opt { width: 100%; text-align: left; font: inherit; color: var(--ink); background: transparent;
  border: 1.5px solid var(--line); border-radius: 10px; padding: 10px 12px; cursor: pointer;
  display: flex; gap: 10px; }
.opt:hover:not(:disabled) { border-color: var(--accent); }
.opt:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.opt .k { font-weight: 700; color: var(--muted); min-width: 1.2em; }
.opt:disabled { cursor: default; }
.opt.correct { border-color: var(--ok); background: var(--ok-bg); }
.opt.wrong { border-color: var(--bad); background: var(--bad-bg); }
.fb { margin: 12px 0 2px; padding: 10px 12px; border-radius: 10px; background: var(--bg); border-left: 4px solid var(--accent); }
.fb strong.ok { color: var(--ok); } .fb strong.no { color: var(--bad); }
.result { text-align: center; padding: 20px; border: 2px dashed var(--accent); border-radius: 14px; }
.result .big { font-size: 2rem; font-weight: 700; }
[hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <h1 id="title"></h1>
  <p class="intro" id="intro"></p>
  <div class="bar" aria-live="polite">
    <span id="score"></span>
    <button id="reset" type="button">Start over</button>
  </div>
  <div id="list"></div>
  <div class="result" id="result" hidden>
    <div class="big" id="final"></div>
    <p id="verdict"></p>
  </div>
</main>
<script>
const DATA = {"title": "1.2 Multi-Agent Orchestration: practice questions", "intro": "Exam-style questions for CCAR-F Task 1.2. Pick an answer to see why it is right or wrong.", "questions": [{"tag": "core", "prompt": "Which multi-agent architecture does the exam test?", "options": ["A peer-to-peer mesh where subagents message each other directly", "Hub-and-spoke: a coordinator at the centre with subagents as the spokes", "A single agent with no subagents", "A chain where each subagent calls the next one"], "answer": 1, "explanation": "The exam tests one pattern: hub-and-spoke. The coordinator receives the task, splits it up, delegates, aggregates, and routes all information."}, {"tag": "core", "prompt": "A synthesis subagent needs what the web search subagent found. What is the right way to get it there?", "options": ["The synthesis subagent reads the web search subagent's conversation history", "The coordinator sets up a memory the two subagents share automatically", "The web search subagent returns its findings to the coordinator, which includes them in the synthesis subagent's prompt", "The web search subagent calls the synthesis subagent directly to save a step"], "answer": 2, "explanation": "All communication routes through the coordinator, and a subagent only knows what is in its prompt. Example 2 pastes both sets of findings into the synthesis task."}, {"tag": "core", "prompt": "A coordinator has had a twenty-turn conversation with the user and now starts a new subagent. What does the subagent know about those twenty turns?", "options": ["Only what the coordinator writes into the subagent's prompt", "All of it: subagents inherit the coordinator's conversation history", "The coordinator's system prompt, but nothing else", "The last five messages, automatically"], "answer": 0, "explanation": "Subagents do not inherit history. They have no access to the coordinator's system prompt (unless it is included), earlier messages, other subagents' results, or shared memory."}, {"tag": "core", "prompt": "A multi-agent system writes a report on \"risks facing a coastal town\". It covers flooding and erosion in depth and every subagent did its assigned job well, but the report says nothing about tourism decline or an ageing population. Where is the root cause?", "options": ["The synthesis subagent should have invented the missing sections", "The web search subagent's queries were too narrow", "The subagents needed a larger context window", "The coordinator's decomposition never assigned those topics to any subagent"], "answer": 3, "explanation": "A subtopic nobody is assigned never gets researched. When whole topics are missing (scope), suspect the decomposition first. Better queries or a smarter synthesis step cannot add an area that no subagent was given."}, {"tag": "core", "prompt": "A teammate proposes letting subagents message each other directly to save time. Why does the exam treat this as the wrong answer?", "options": ["Subagents cannot produce text that another agent can read", "It bypasses the coordinator, losing observability, consistent error handling and controlled information flow", "It is slower in every case, which is its only drawback", "It requires every subagent to use the same model"], "answer": 1, "explanation": "Even when offered as an efficiency gain, direct inter-subagent communication gives up the three benefits of a single hub."}, {"tag": "core", "prompt": "A subagent returns an incomplete answer for its task. What should you check first?", "options": ["Whether the subagent's model is too small", "Whether the synthesis subagent hid the missing part", "Whether the coordinator gave it the right input, meaning the full context in its prompt", "Whether the user's question was too long"], "answer": 2, "explanation": "Blame the origin, not the output. Subagents start blank, so incomplete output often traces back to what the coordinator did or did not pass in."}, {"tag": "core", "prompt": "A user asks, \"What time does the council recycling centre open?\" How should a well-designed coordinator handle it?", "options": ["Invoke only the subagent(s) the question needs, here just web search", "Run the full pipeline anyway so every query is handled the same way", "Run every subagent in parallel and keep whichever answers first", "Have the synthesis subagent answer from its own knowledge without searching"], "answer": 0, "explanation": "Dynamic subagent selection: analyse what the query needs and invoke only those subagents. A simple factual question needs only web search."}, {"tag": "core", "prompt": "To cut costs, a team runs every query through all subagents and caches the unused results. Why does caching not fix the problem?", "options": ["Caching cannot be used with subagents", "Cached results are always out of date", "Unused results always make the final answer worse", "Invoking unneeded subagents still adds latency and API overhead, so the coordinator should choose subagents per query"], "answer": 3, "explanation": "The cost is incurred when the unneeded subagents run, cached or not. Select the subagents each query actually needs."}, {"tag": "core", "prompt": "Two subagents keep searching the same sources and return duplicate findings. Which coordinator responsibility addresses this?", "options": ["Iterative refinement: re-run both until their results differ", "Research scope partitioning: give each subagent distinct subtopics or source types", "Dynamic selection: drop one of them for every query", "Communication routing: let them compare notes directly"], "answer": 1, "explanation": "Partition the scope so no two subagents cover the same ground. In example 4, one subagent covers the web and the other covers internal documents."}, {"tag": "core", "prompt": "A synthesis draft has no section on insurance costs, though the topic needs one. What does a good coordinator do?", "options": ["Accept the draft and add a disclaimer", "Ask the synthesis subagent to guess the insurance figures", "Re-delegate a targeted search for insurance costs, then synthesise again and re-check coverage", "Restart all the research from the original question"], "answer": 2, "explanation": "That is the iterative refinement loop: evaluate the output for gaps, re-delegate with targeted queries, and re-run synthesis until coverage is sufficient."}, {"tag": "core", "prompt": "Which of these is NOT a benefit of routing all subagent communication through one coordinator?", "options": ["Subagents automatically share each other's memory", "Every message can be logged and monitored in one place", "Errors are handled with one consistent recovery policy", "The coordinator controls what context each subagent receives"], "answer": 0, "explanation": "The benefits are observability, consistent error handling and controlled information flow. Subagents do not share memory: the coordinator passes context explicitly."}, {"tag": "core", "prompt": "A subagent fails partway through its task. In hub-and-spoke, who decides how to recover (retry, re-delegate, or carry on without it)?", "options": ["The failed subagent, by calling another subagent itself", "The user, in every case", "The next subagent in the chain", "The coordinator, applying a consistent recovery policy"], "answer": 3, "explanation": "Handling errors is one of the coordinator's responsibilities, which is what makes recovery consistent across subagents."}, {"tag": "core", "prompt": "A web search subagent is invoked twice in one run, and the second invocation needs to know what the first one found. What must the coordinator do?", "options": ["Nothing: subagents share memory between invocations", "Include the first invocation's findings in the second invocation's prompt", "Nothing: the API remembers earlier calls", "Rename the subagent so it is recognised the second time"], "answer": 1, "explanation": "Subagents do not share memory between invocations. A second invocation knows nothing about the first unless the coordinator passes it along. Example 1, run C, shows this."}, {"tag": "core", "prompt": "A report has a section on geothermal energy that is shallow, while the solar section is detailed. The coordinator assigned both subtopics. What should you suspect first?", "options": ["A missing subtopic in the decomposition", "The solar subagent using up the shared memory", "What that subagent was told and given: its prompt, tools and context for geothermal", "The report's formatting"], "answer": 2, "explanation": "The subtopic was assigned, so decomposition is not the problem. A thin section is a depth problem: look at that subagent's instructions, tools and context. A missing section is a scope problem and points to the decomposition."}, {"tag": "core", "prompt": "An iterative refinement loop re-delegates to fill coverage gaps. How should it end?", "options": ["When coverage is sufficient, with a maximum number of rounds as a safety bound", "After exactly one round, always", "Only when it reaches the maximum number of rounds", "When the synthesis subagent writes \"done\""], "answer": 0, "explanation": "Like the loop in 1.1, it should end on its real signal (sufficient coverage), with a maximum round count as a backup. Example 4 stops at 3 refinements with a warning."}, {"tag": "bonus", "prompt": "A study note says subagents can never spawn other subagents. According to the lesson's current-state note, how accurate is that?", "options": ["Fully accurate in every Claude product", "Wrong: subagents can spawn an unlimited number of layers", "Accurate, but only for web search subagents", "A simplification for the exam: in Claude Code a subagent can spawn subagents, up to three layers below the main conversation"], "answer": 3, "explanation": "The lesson notes this as the current state (checked October 2026). The exam still keys hub-and-spoke, so answer exam questions with the coordinator at the centre."}]};
const LETTERS = "ABCDEFGH";
const $ = (id) => document.getElementById(id);
let answered = 0, correct = 0;

function el(tag, cls, text) {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text !== undefined) n.textContent = text;
  return n;
}

function updateScore() {
  const total = DATA.questions.length;
  $("score").textContent = `Answered ${answered} of ${total}  ·  Correct ${correct}`;
  if (answered === total) {
    const pct = Math.round((correct / total) * 100);
    $("final").textContent = `${correct} / ${total}  (${pct}%)`;
    $("verdict").textContent = pct >= 80
      ? "Strong. Move on to the next topic, or re-read the notes for anything you missed."
      : "Re-read the notes and the explanations for the ones you missed, then try again.";
    $("result").hidden = false;
  } else {
    $("result").hidden = true;
  }
}

function build() {
  answered = 0; correct = 0;
  $("title").textContent = DATA.title;
  $("intro").textContent = DATA.intro;
  const list = $("list");
  list.replaceChildren();

  DATA.questions.forEach((q, qi) => {
    const card = el("section", "card");
    const head = el("div", "q-head");
    head.append(el("span", "", `Question ${qi + 1}`),
      el("span", "pill" + (q.tag === "bonus" ? " bonus" : ""), q.tag === "bonus" ? "Beyond the exam key" : "Exam topic"));
    card.append(head, el("p", "prompt", q.prompt));

    const ul = el("ul", "opts");
    const buttons = [];
    const fb = el("div", "fb");
    fb.hidden = true;
    fb.setAttribute("role", "status");

    q.options.forEach((text, oi) => {
      const li = el("li");
      const b = el("button", "opt");
      b.type = "button";
      b.append(el("span", "k", LETTERS[oi]), el("span", "", text));
      b.addEventListener("click", () => {
        buttons.forEach((x) => (x.disabled = true));
        const right = oi === q.answer;
        buttons[q.answer].classList.add("correct");
        if (!right) b.classList.add("wrong");
        const label = el("strong", right ? "ok" : "no", right ? "Correct. " : `Not quite. The answer is ${LETTERS[q.answer]}. `);
        fb.replaceChildren(label, document.createTextNode(q.explanation));
        fb.hidden = false;
        answered += 1; if (right) correct += 1;
        updateScore();
      });
      buttons.push(b);
      li.append(b);
      ul.append(li);
    });
    card.append(ul, fb);
    list.append(card);
  });
  updateScore();
}

$("reset").addEventListener("click", () => { build(); window.scrollTo({ top: 0 }); });
build();
</script>
</body>
</html>
